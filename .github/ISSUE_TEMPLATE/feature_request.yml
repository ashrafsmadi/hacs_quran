name: Feature request
description: Propose a focused Quran Player improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need rather than only the desired implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: The request preserves one Quran Player device and one config entry.
          required: true
        - label: The request does not require bundling recordings or scraping a website at runtime.
          required: true
        - label: I have not included credentials or private Home Assistant data.
          required: true
