[project]
name = "hacs-quran-player"
version = "1.0.0"
description = "A HACS custom integration for multi-output Quran playback"
requires-python = ">=3.14.2"
license = "MIT"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "LOG", "PIE", "RUF", "SIM", "UP"]
ignore = ["E501"]
